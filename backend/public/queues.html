<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>StyleMD Queue Dashboard</title>
<style>
  :root {
    --bg: #0e1015;
    --panel: #161a22;
    --panel2: #1d222c;
    --border: #2a3140;
    --text: #e6e8ec;
    --muted: #8a93a3;
    --accent: #4ea1ff;
    --green: #3ec97a;
    --amber: #f5a623;
    --red: #ef5350;
    --purple: #b97aff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    font-size: 13px;
    line-height: 1.45;
  }
  header {
    position: sticky; top: 0; z-index: 10;
    padding: 14px 24px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 16px;
  }
  header h1 {
    margin: 0; font-size: 15px; font-weight: 600; letter-spacing: 0.2px;
  }
  header .grow { flex: 1; }
  header input {
    background: var(--panel2);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 7px 10px;
    border-radius: 6px;
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 12px;
    width: 380px;
  }
  header button {
    background: var(--accent);
    border: none;
    color: white;
    padding: 7px 14px;
    border-radius: 6px;
    cursor: pointer;
    font-weight: 600;
  }
  header button:hover { filter: brightness(1.1); }
  header .interval {
    color: var(--muted);
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 12px;
  }

  main { padding: 20px 24px; max-width: 1400px; margin: 0 auto; }

  .cards { display: grid; grid-template-columns: repeat(6, 1fr); gap: 12px; margin-bottom: 24px; }
  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px 16px;
  }
  .card .label {
    text-transform: uppercase;
    font-size: 10px;
    letter-spacing: 0.6px;
    color: var(--muted);
    margin-bottom: 6px;
  }
  .card .value { font-size: 24px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .card.waiting .value { color: var(--amber); }
  .card.active .value { color: var(--accent); }
  .card.completed .value { color: var(--green); }
  .card.failed .value { color: var(--red); }
  .card.delayed .value { color: var(--purple); }
  .card.paused .value { color: var(--muted); }

  section { margin-bottom: 28px; }
  section h2 {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    color: var(--muted);
    font-weight: 600;
    margin: 0 0 10px;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
  }
  th, td {
    text-align: left;
    padding: 9px 12px;
    border-bottom: 1px solid var(--border);
    vertical-align: middle;
    font-variant-numeric: tabular-nums;
  }
  th {
    background: var(--panel2);
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.6px;
    color: var(--muted);
    font-weight: 600;
  }
  tr:last-child td { border-bottom: none; }
  td.id { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 11px; }
  td.url { font-family: ui-monospace, "SF Mono", Menlo, monospace; color: var(--muted); }
  td.url a { color: var(--accent); text-decoration: none; }
  td.url a:hover { text-decoration: underline; }
  .badge {
    display: inline-block;
    padding: 2px 7px;
    border-radius: 3px;
    font-size: 10px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.4px;
  }
  .badge.waiting   { background: rgba(245,166,35,0.18);  color: var(--amber); }
  .badge.active    { background: rgba(78,161,255,0.18);  color: var(--accent); }
  .badge.completed { background: rgba(62,201,122,0.18);  color: var(--green); }
  .badge.failed    { background: rgba(239,83,80,0.18);   color: var(--red); }
  .badge.delayed   { background: rgba(185,122,255,0.18); color: var(--purple); }

  .progress {
    height: 6px;
    background: var(--panel2);
    border-radius: 3px;
    overflow: hidden;
    min-width: 80px;
  }
  .progress > div {
    height: 100%;
    background: var(--accent);
    transition: width 0.25s ease;
  }

  td.actions { text-align: right; white-space: nowrap; }
  td.actions button {
    background: transparent;
    color: var(--muted);
    border: 1px solid var(--border);
    padding: 4px 10px;
    border-radius: 4px;
    cursor: pointer;
    font-size: 11px;
    margin-left: 6px;
  }
  td.actions button:hover { color: var(--text); border-color: var(--accent); }
  td.actions button.danger:hover { color: var(--red); border-color: var(--red); }

  .empty { padding: 20px; text-align: center; color: var(--muted); font-size: 12px; }
  .err {
    background: rgba(239,83,80,0.12);
    border: 1px solid rgba(239,83,80,0.4);
    color: var(--red);
    padding: 10px 14px;
    border-radius: 6px;
    margin-bottom: 16px;
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 12px;
  }
  .err.hidden { display: none; }
  .timing { color: var(--muted); font-size: 11px; }
</style>
</head>
<body>
<header>
  <h1>🛠 StyleMD Queue — scrape</h1>
  <input id="token" type="password" placeholder="Admin bearer token (saved to localStorage)" />
  <span class="grow"></span>
  <span class="interval" id="lastRefresh">—</span>
  <button id="refresh">Refresh now</button>
</header>

<main>
  <div id="error" class="err hidden"></div>

  <div class="cards" id="cards">
    <div class="card waiting"><div class="label">Waiting</div><div class="value" data-k="waiting">–</div></div>
    <div class="card active"><div class="label">Active</div><div class="value" data-k="active">–</div></div>
    <div class="card completed"><div class="label">Completed</div><div class="value" data-k="completed">–</div></div>
    <div class="card failed"><div class="label">Failed</div><div class="value" data-k="failed">–</div></div>
    <div class="card delayed"><div class="label">Delayed</div><div class="value" data-k="delayed">–</div></div>
    <div class="card paused"><div class="label">Paused</div><div class="value" data-k="paused">–</div></div>
  </div>

  <section>
    <h2>Active (<span data-count="active">0</span>)</h2>
    <table>
      <thead><tr><th style="width:22%">Job ID</th><th>URL</th><th style="width:10%">Progress</th><th style="width:8%">Attempts</th><th style="width:10%">Started</th><th style="width:120px"></th></tr></thead>
      <tbody id="tbl-active"></tbody>
    </table>
  </section>

  <section>
    <h2>Waiting (<span data-count="waiting">0</span>)</h2>
    <table>
      <thead><tr><th style="width:22%">Job ID</th><th>URL</th><th style="width:10%">Provider</th><th style="width:10%">Queued</th><th style="width:120px"></th></tr></thead>
      <tbody id="tbl-waiting"></tbody>
    </table>
  </section>

  <section>
    <h2>Recent Completed (<span data-count="completed">0</span>)</h2>
    <table>
      <thead><tr><th style="width:22%">Job ID</th><th>URL</th><th style="width:12%">Duration</th><th>R2 preview.html</th></tr></thead>
      <tbody id="tbl-completed"></tbody>
    </table>
  </section>

  <section>
    <h2>Recent Failed (<span data-count="failed">0</span>)</h2>
    <table>
      <thead><tr><th style="width:22%">Job ID</th><th>URL</th><th style="width:8%">Attempts</th><th>Error</th><th style="width:160px"></th></tr></thead>
      <tbody id="tbl-failed"></tbody>
    </table>
  </section>
</main>

<script>
const $ = (s) => document.querySelector(s);
const tokenInput = $("#token");
tokenInput.value = localStorage.getItem("adminToken") || "";
tokenInput.addEventListener("change", () => localStorage.setItem("adminToken", tokenInput.value));

const errBox = $("#error");
function showError(msg) {
  errBox.textContent = msg;
  errBox.classList.remove("hidden");
}
function clearError() { errBox.classList.add("hidden"); }

async function api(path, opts = {}) {
  const token = tokenInput.value.trim();
  if (!token) throw new Error("Set the admin bearer token at the top.");
  const r = await fetch(path, {
    ...opts,
    headers: { ...(opts.headers || {}), Authorization: "Bearer " + token, "Content-Type": "application/json" },
  });
  if (!r.ok) {
    const text = await r.text();
    throw new Error(r.status + " " + r.statusText + " — " + text.slice(0, 200));
  }
  return r.json();
}

function escapeHtml(s) {
  return String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
}

function fmtDuration(ms) {
  if (!ms || ms < 0) return "—";
  if (ms < 1000) return ms + "ms";
  if (ms < 60_000) return (ms / 1000).toFixed(1) + "s";
  const m = Math.floor(ms / 60000);
  const s = Math.round((ms % 60000) / 1000);
  return m + "m" + s.toString().padStart(2, "0") + "s";
}

function fmtAgo(ts) {
  if (!ts) return "—";
  const d = Date.now() - ts;
  if (d < 0) return "now";
  if (d < 60_000) return Math.round(d / 1000) + "s ago";
  if (d < 3_600_000) return Math.round(d / 60_000) + "m ago";
  return Math.round(d / 3_600_000) + "h ago";
}

function renderActive(jobs) {
  const tbody = $("#tbl-active");
  if (!jobs.length) { tbody.innerHTML = `<tr><td colspan="6" class="empty">No active jobs.</td></tr>`; return; }
  tbody.innerHTML = jobs.map((j) => {
    const prog = typeof j.progress === "number" ? j.progress : 0;
    return `<tr>
      <td class="id">${escapeHtml(j.id)}</td>
      <td class="url">${escapeHtml(j.data?.url ?? "")}</td>
      <td><div class="progress"><div style="width:${prog}%"></div></div><span class="timing">${prog}%</span></td>
      <td>${j.attemptsMade}</td>
      <td class="timing">${fmtAgo(j.processedOn || j.timestamp)}</td>
      <td class="actions">
        <button onclick="removeJob('${escapeHtml(j.id)}')" class="danger">Cancel</button>
      </td>
    </tr>`;
  }).join("");
}

function renderWaiting(jobs) {
  const tbody = $("#tbl-waiting");
  if (!jobs.length) { tbody.innerHTML = `<tr><td colspan="5" class="empty">No waiting jobs.</td></tr>`; return; }
  tbody.innerHTML = jobs.map((j) => `<tr>
    <td class="id">${escapeHtml(j.id)}</td>
    <td class="url">${escapeHtml(j.data?.url ?? "")}</td>
    <td><span class="badge waiting">${escapeHtml(j.data?.provider ?? "kimi")}</span></td>
    <td class="timing">${fmtAgo(j.timestamp)}</td>
    <td class="actions">
      <button onclick="removeJob('${escapeHtml(j.id)}')" class="danger">Remove</button>
    </td>
  </tr>`).join("");
}

function renderCompleted(jobs) {
  const tbody = $("#tbl-completed");
  if (!jobs.length) { tbody.innerHTML = `<tr><td colspan="4" class="empty">No completed jobs.</td></tr>`; return; }
  tbody.innerHTML = jobs.map((j) => {
    const dur = j.finishedOn && j.processedOn ? j.finishedOn - j.processedOn : null;
    const r2 = j.returnvalue?.r2?.previewHtml;
    return `<tr>
      <td class="id">${escapeHtml(j.id)}</td>
      <td class="url">${escapeHtml(j.data?.url ?? "")}</td>
      <td class="timing">${fmtDuration(dur)}</td>
      <td class="url">${r2 ? `<a href="${escapeHtml(r2)}" target="_blank">${escapeHtml(r2)}</a>` : "—"}</td>
    </tr>`;
  }).join("");
}

function renderFailed(jobs) {
  const tbody = $("#tbl-failed");
  if (!jobs.length) { tbody.innerHTML = `<tr><td colspan="5" class="empty">No failed jobs.</td></tr>`; return; }
  tbody.innerHTML = jobs.map((j) => `<tr>
    <td class="id">${escapeHtml(j.id)}</td>
    <td class="url">${escapeHtml(j.data?.url ?? "")}</td>
    <td>${j.attemptsMade}</td>
    <td class="url" style="color:var(--red)">${escapeHtml((j.failedReason ?? "").slice(0, 200))}</td>
    <td class="actions">
      <button onclick="retryJob('${escapeHtml(j.id)}')">Retry</button>
      <button onclick="removeJob('${escapeHtml(j.id)}')" class="danger">Remove</button>
    </td>
  </tr>`).join("");
}

async function retryJob(id) {
  try {
    await api(`/api/admin/jobs/${encodeURIComponent(id)}/retry`, { method: "POST" });
    refresh();
  } catch (e) { showError(e.message); }
}
window.retryJob = retryJob;

async function removeJob(id) {
  if (!confirm("Remove job " + id + "?")) return;
  try {
    await api(`/api/admin/jobs/${encodeURIComponent(id)}`, { method: "DELETE" });
    refresh();
  } catch (e) { showError(e.message); }
}
window.removeJob = removeJob;

async function refresh() {
  try {
    const stats = await api("/api/admin/queues/stats");
    clearError();
    Object.entries(stats.counts).forEach(([k, v]) => {
      document.querySelectorAll(`[data-k="${k}"]`).forEach((el) => (el.textContent = v));
      document.querySelectorAll(`[data-count="${k}"]`).forEach((el) => (el.textContent = v));
    });

    const [active, waiting, completed, failed] = await Promise.all([
      api("/api/admin/queues/jobs?state=active&limit=20"),
      api("/api/admin/queues/jobs?state=waiting&limit=20"),
      api("/api/admin/queues/jobs?state=completed&limit=20"),
      api("/api/admin/queues/jobs?state=failed&limit=20"),
    ]);
    renderActive(active.jobs);
    renderWaiting(waiting.jobs);
    renderCompleted(completed.jobs);
    renderFailed(failed.jobs);

    $("#lastRefresh").textContent = "Refreshed " + new Date().toLocaleTimeString() + " · auto every 3s";
  } catch (e) {
    showError(e.message);
  }
}

$("#refresh").addEventListener("click", refresh);
refresh();
setInterval(refresh, 3000);
</script>
</body>
</html>
